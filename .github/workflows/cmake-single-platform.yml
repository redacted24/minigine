# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache APT Packages
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: build-essential python3-apt clang-tidy gh cmake libglm-dev ninja-build libgl-dev libx11-dev libxrandr-dev libxi-dev libspdlog-dev libfreetype-dev

    - uses: libsdl-org/setup-sdl@main
      id: sdl
      with:
        install-linux-dependencies: true
        version: 3-latest
        version-sdl-image: 3-latest

    - name: Cache pre-commit environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-${{ runner.os }}-

    - name: Install pre-commit
      run: |
        python3 -m venv .venv
        .venv/bin/pip install pre-commit

    - name: Configure CMake
      run: |
        cmake -S . -B build/debug \
          -DCMAKE_BUILD_TYPE=Debug -Wno-deprecated\
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -G Ninja

    - name: Run pre-commit
      run: .venv/bin/pre-commit run --all-files
