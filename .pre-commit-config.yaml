repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    # -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-executables-have-shebangs
    -   id: check-shebang-scripts-are-executable
    -   id: detect-private-key

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-tidy
        args: ["--version=18"]
        args: ["-p=build"]

  - repo: local
    hooks:
      - id: build
        name: Build project
        entry: bash -c "cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug -Wno-deprecated -G Ninja && cmake --build build/debug --verbose"
        language: system
        pass_filenames: false
        always_run: true

      - id: ctest
        name: Run CTest
        entry: bash -c "cd build/debug/tests && ctest --output-on-failure"
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
